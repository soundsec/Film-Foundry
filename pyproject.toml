[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "film-foundry"
version = "0.4.0"
description = "Material-based film and developed-medium workflow."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "COPYING", "third_party_licenses/ROBOTO_APACHE_2_0.txt"]
authors = [{ name = "soundsec" }]
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "Pillow>=10.0",
  "tifffile>=2023.7",
  "rawpy>=0.25,<0.29",
  "python-lcms2>=0.1.1,<0.2",
  "PySide6-Essentials>=6.8,<7",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: Image Processing",
]

[project.urls]
Homepage = "https://github.com/soundsec/Film-Foundry"
Repository = "https://github.com/soundsec/Film-Foundry"
Issues = "https://github.com/soundsec/Film-Foundry/issues"

[project.optional-dependencies]
test = ["pytest>=8.0"]
video = ["av>=16.1,<17"]
cuda = ["cupy-cuda12x>=14.2,<15", "nvidia-cuda-runtime-cu12", "nvidia-cuda-nvrtc-cu12"]
opencl = ["pyopencl>=2024.3,<2027"]

[project.scripts]
film-foundry = "film_foundry.app.cli:main"
electronic-negative-factory = "film_foundry.app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["film_foundry*"]

[tool.setuptools.package-data]
film_foundry = ["contracts/material_state_fields.json", "presets/*.json", "presets/*/*.json", "assets/*.svg", "assets/*.png", "assets/*.ico", "assets/*.bin", "assets/edge_sans.txt", "assets/edge_rounded.txt", "assets/date_segments.txt", "assets/date_segments_narrow.txt", "assets/harman_red_125_wedge.txt", "assets/selection_examples.sqlite3"]

[tool.pytest.ini_options]
testpaths = ["film_foundry/tests"]
norecursedirs = ["#BackUp", "build", "dist", ".git", ".pytest_cache", "__pycache__"]
